<!DOCTYPE html>
<html>
<head>
    <title>Environmental Risk Explorer</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        #map {
            height: 600px;
            width: 100%;
        }

        h1 {
            text-align: center;
        }

        #searchBox {
            text-align: center;
            margin-bottom: 10px;
        }

        input {
            padding: 8px;
            width: 250px;
        }

        button {
            padding: 8px;
        }
    </style>
</head>
<body>

<h1>Environmental Risk Explorer</h1>

<div id="searchBox">
    <input type="text" id="locationInput" placeholder="Enter a city (e.g., Chicago)">
    <button onclick="searchLocation()">Search</button>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
    var map = L.map('map').setView([44.95, -93.09], 11);

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19
    }).addTo(map);

    var currentMarker;

    function searchLocation() {
        var location = document.getElementById("locationInput").value;

        // Use OpenStreetMap geocoding API
        fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${location}`)
            .then(response => response.json())
            .then(data => {
                if (data.length === 0) {
                    alert("Location not found");
                    return;
                }

                var lat = data[0].lat;
                var lon = data[0].lon;

                map.setView([lat, lon], 12);

                if (currentMarker) {
                    map.removeLayer(currentMarker);
                }

                // Fake sample data (improve this later)
                var pollution = ["Low", "Medium", "High"][Math.floor(Math.random()*3)];
                var percentBlack = Math.floor(Math.random()*100) + "%";
                var hazards = ["Highway", "Factory", "Power Plant"];

                currentMarker = L.marker([lat, lon]).addTo(map);

                currentMarker.bindPopup(`
                    <b>${location}</b><br>
                    Pollution Level: ${pollution}<br>
                    % Black Population: ${percentBlack}<br>
                    Hazards: ${hazards[Math.floor(Math.random()*hazards.length)]}
                `).openPopup();
            });
    }
</script>

</body>
</html>
